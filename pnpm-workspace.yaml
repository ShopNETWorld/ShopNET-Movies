packages:
  - 'apps/*'
  - 'packages/*'
  - 'benchmark'
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver
